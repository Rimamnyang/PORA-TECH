<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=h2, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
</head>

<body id="body1">
    <h2>CONTACT FORM</h2>
    <br>
    <button id="click1">CLICK HERE</button>
    <br>
    <div class="container">
        <label for="firstnam">First Name</label><br>
        <input type="text" id="firstnam" placeholder="First Name"><br>
        <label for="lastnam">Last Name</label><br>
        <input type="text" id="lastnam" placeholder="Last Name"><br>
        <label for="email">Email</label><br>
        <input type="email" id="email" placeholder="Email"><br>
        <label for="phone">Phone</label><br>
        <input type="tel" id="phone" placeholder="Phone"><br>
        <label for="address">Address</label><br>
        <input type="text" id="address" placeholder="Address"><br>
        <label for="message">Message</label><br>
        <textarea type="text" id="message" cols="50" rows="5" placeholder="Message"></textarea><br>
    </div>
    <br>
    <button id="btn">Submit</button>
    <div id="box3">
        <p>
            Theme Change
        </p>
        <button id="button1">Light</button>
        <button id="button2">Dark</button>
        <button id="button3">Pink</button>
        <button id="button4">Blue</button>
    </div>
    <script>
        document.getElementById('click1').addEventListener('click', function () {
            document.getElementById('click1').textContent = 'you clicked';
        });
        document.getElementById('btn').addEventListener('click', function () {
            document.getElementById('btn').textContent = "Submitted";
        });
        document.getElementById('button1').addEventListener('click', function () {
            document.getElementById('body1').style.backgroundColor = 'white';
        });
        document.getElementById('button2').addEventListener('click', function () {
            document.getElementById('body1').style.backgroundColor = 'black';
        });
        document.getElementById('button3').addEventListener('click', function () {
            document.getElementById('body1').style.backgroundColor = 'pink';
        });
        document.getElementById('button4').addEventListener('click', function () {
            document.getElementById('body1').style.backgroundColor = 'blue';
        });

    </script>
</body>

</html>
